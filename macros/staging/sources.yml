# Aquí declaramos:
#   - El nombre lógico del source (cómo lo referenciaremos en los modelos)
#   - La base de datos y schema físicos donde residen los datos crudos
#   - Comportamiento de quoting (en Snowflake, false por defecto)
#   - Reglas de freshness para detectar datos obsoletos
#   - Tablas con sus columnas, descripciones y tests
#
# Para invocar este source desde un modelo:
#   {{ source('dev_bronze', '') }}
# ============================================================================

version: 2

sources:
  - name: dev_raw_bronze
    database: _DEV_FITLIFE_BRONZE_DB
    schema: RAW
    tables:
      - name: raw_users
        description: "Tabla con los datos en bruto de usuarios"
        columns:
          - name: user_id
            data_type: number
            tests:
              - unique
              - not_null
          - name: user_name
            data_type: varchar
            tests:
              - unique
              - not_null
          - name: email
            data_type: varchar
            tests:
              - not_null
          - name: gender
            data_type: varchar
            tests:
            - accepted_values:
                values: ['Male', 'Female', 'Non-binary']
          - name: city
            data_type: varchar
          - name: age
            data_type: number
          - name: registration_date
            data_type: date
            tests:
              - not_null

      - name: raw_user_sessions
        description: "Tabla con los datos en bruto de sesiones"
        columns:
          - name: session_id
            data_type: number
            tests:
              - unique
              - not_null
          - name: user_id
            data_type: number
            tests:
              - not_null
          - name: login_date
            data_type: date
            tests:
              - not_null
          - name: device_type
            data_type: varchar
            tests:
              - not_null
          - name: app_version
            data_type: varchar
          - name: session_duration_seconds
            data_type: number
            tests:
              - not_null
      
      - name: raw_orders
        description: "Tabla con los datos en bruto de pedidos"
        columns:
          - name: order_id
            data_type: number
            tests:
              - unique
              - not_null
          - name: user_id
            data_type: number
            tests:
              - not_null
          - name: payment_method
            data_type: varchar
            tests:
              - not_null
          - name: payment_status
            data_type: varchar
            tests:
              - not_null
              - accepted_values:
                  values: ['Failed', 'Completed', 'Refunded', 'Pending']
          - name: payment_amount
            data_type: number
          - name: order_date
            data_type: date
            tests:
              - not_null
          - name: product_category
            data_type: varchar
            tests:
              - not_null
          - name: quantity
            data_type: number
            tests:
              - not_null

      - name: raw_subscriptions
        description: "Tabla con los datos en bruto de suscripciones"
        columns:
          - name: subscription_id
            data_type: number
            tests:
              - unique
              - not_null
          - name: user_id
            data_type: number
            tests:
              - not_null
          - name: plan_name
            data_type: varchar
            tests:
              - not_null
              - accepted_values:
                  values: ['Pro', 'Elite', 'Family', 'Basic']
          - name: start_date
            data_type: date
            tests:
              - not_null
          - name: end_date
            data_type: date
          - name: status
            data_type: varchar
            tests:
              - not_null
              - accepted_values:
                  values: ['Active', 'Expired', 'Cancelled', 'Pending']
          - name: monthly_price
            data_type: number
            tests:
              - not_null
          - name: payment_method
            data_type: varchar
            tests:
              - not_null
          - name: payment_status
            data_type: varchar
            tests:
              - not_null
              - accepted_values:
                  values: ['Complete', 'Failed', 'Pending']

      - name: raw_activity_logs
        description: "Tabla con los datos en bruto de actividad"
        columns:
          - name: activity_id
            data_type: number
            tests:
              - unique
              - not_null 
          - name: user_id
            data_type: number
            tests:
              - not_null 
          - name: activity_type
            data_type: varchar
            tests:
              - not_null 
          - name: duration_minutes
            data_type: number
            tests:
              - not_null
          - name: calories_burned
            data_type: number
          - name: activity_date
            data_type: date
            tests:
              - not_null